name: Gossenheld APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP entpacken (falls hochgeladen)
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z" && echo "Entpackt: $z"
          done
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: Querformat einstellen
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Festen Signaturschlüssel verwenden (damit Updates den Spielstand behalten)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Gossenheld.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gossenheld Build ${{ github.run_number }}
          files: Gossenheld.apk
          make_latest: true
