name: Gossenheld APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: ZIP entpacken (falls hochgeladen)
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Entpacke: $z"
            unzip -o "$z"
          done
          if [ ! -f package.json ]; then
            echo "::error::Keine Spieldateien gefunden. Bitte gossenheld.zip ins Repository hochladen."
            exit 1
          fi
          ls -la

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: Querformat einstellen
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Festen Signaturschlüssel verwenden (damit Updates den Spielstand behalten)
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "::warning::debug.keystore fehlt – die APK bekommt einen zufälligen Schlüssel."
          fi

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Gossenheld.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gossenheld Build ${{ github.run_number }}
          files: Gossenheld.apk
          make_latest: true
